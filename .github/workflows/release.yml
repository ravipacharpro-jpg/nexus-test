name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload binaries to (e.g. v0.1.60-nexus-autonomy)"
        required: false
        default: "v0.1.60-nexus-autonomy"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            arch: arm64
          - runner: ubuntu-24.04
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system build tools (native modules)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        env:
          HUSKY: 0
        run: bun install

      - name: Build NEXUS binary (current platform)
        run: bun run --cwd packages/nexus build --single --skip-embed-web-ui

      - name: Package archive
        run: |
          cd packages/nexus
          tar -czf "nexus-linux-${{ matrix.arch }}.tar.gz" -C "dist/nexus-linux-${{ matrix.arch }}" .

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          gh release upload "$TAG" "packages/nexus/nexus-linux-${{ matrix.arch }}.tar.gz" --clobber
