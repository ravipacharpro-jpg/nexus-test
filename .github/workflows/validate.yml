name: Validate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate agents/skills/commands/config (cross-platform)
        run: node scripts/validate.js
